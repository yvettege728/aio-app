<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
.s{position:relative;overflow:hidden}
.b{position:absolute;border-radius:50%}
</style></head><body><div id="root"></div>
<script>
const MAIN = "M98 80 C88 62 56 62 46 84 C36 106 52 126 72 120 C88 115 96 98 98 80 C97 100 96 118 104 124 C112 130 124 118 130 98 C131 92 133 86 134 82 C132 100 132 116 140 122 C150 128 164 120 172 104 C178 90 186 76 200 75 C218 75 226 96 220 110 C214 124 194 128 182 118 C171 108 176 86 194 79 C214 71 236 78 262 64";
const DOT = "M131 50 C139 46 145 54 140 63 C137 58 133 56 131 50 Z";
// mark svg string; w = px width; layers for liquid
function hand(w, ink, sw, rough){
  const h = Math.round(w*120/270);
  return `<svg viewBox="20 30 270 120" width="${w}" height="${h}" style="display:block;overflow:visible">
  <defs><filter id="rf" x="-10%" y="-20%" width="120%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="${rough}"/></filter></defs>
  <g filter="url(#rf)" fill="none" stroke="${ink}" stroke-linecap="round" stroke-linejoin="round">
  <path stroke-width="${sw}" d="${MAIN}"/><path fill="${ink}" stroke="none" d="${DOT}"/></g></svg>`;
}
function liquid(w, look){
  const h = Math.round(w*120/270);
  const sw = 9, u = 270/w; // viewBox units per px
  const n = Math.max(0.5, w*0.0095)*u; // nudge in vb units
  const L = (ink, s, dx, dy, op, blur) => `<g transform="translate(${dx},${dy})" opacity="${op}" ${blur?`filter="url(#bl${blur})"`:''} fill="none" stroke="${ink}" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="${s}" d="${MAIN}"/><path fill="${ink}" stroke="${ink}" stroke-width="${Math.max(0,s-sw)}" d="${DOT}"/></g>`;
  const D = (ink, s, dx, dy, op, blur) => `<g transform="translate(${dx},${dy})" opacity="${op}" ${blur?`filter="url(#bl${blur})"`:''}><path fill="${ink}" stroke="${ink}" stroke-width="${s}" stroke-linejoin="round" d="${DOT}"/></g>`;
  // main stroke layers + dot layers drawn as filled shape with stroke for size
  const lay = (ink,s,dx,dy,op,blur) => `<g transform="translate(${dx},${dy})" opacity="${op}" ${blur?`filter="url(#bl${blur})"`:''} stroke="${ink}" stroke-linecap="round" stroke-linejoin="round"><path fill="none" stroke-width="${s}" d="${MAIN}"/><path fill="${ink}" stroke-width="${Math.max(0.01,s-5)}" d="${DOT}"/></g>`;
  return `<svg viewBox="20 30 270 120" width="${w}" height="${h}" style="display:block;overflow:visible">
  <defs><filter id="bl1" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="${2.2}"/></filter>
  <filter id="bl2" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="0.35"/></filter></defs>
  ${lay('#2E3A78', sw, 0, 2.6, 0.3, 1)}
  ${lay(look.rim, sw, 0, 0, look.rimA, 0)}
  ${lay(look.core, sw*0.55, 0, 0, 0.85, 0)}
  ${lay(look.caustic, Math.max(1,sw*0.18), n*1.2, n*1.4, 0.9, 2)}
  ${lay('#FFFFFF', Math.max(1,sw*0.2), -n, -n*1.2, 1, 2)}
  </svg>`;
}
const LOOK = { rim:'#FBFCFF', rimA:0.95, core:'#AEBBEF', caustic:'#9FD3EE' };
const grain = (W,H,op,id) => `<svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;opacity:${op};mix-blend-mode:soft-light"><filter id="${id}"><feTurbulence type="fractalNoise" baseFrequency="${0.9*1024/Math.max(W,H)*0.0+0.9}" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="${W}" height="${H}" filter="url(#${id})"/></svg>`;
function bloomBg(S){ // square S, from AppIcon percentages
  const bl = Math.round(S*0.1);
  return `<div class="b" style="left:-30%;top:-15%;width:160%;height:55%;background:#F6DDE6;filter:blur(${bl}px)"></div>
  <div class="b" style="left:-25%;top:28%;width:150%;height:45%;background:#6C7FD8;filter:blur(${bl}px)"></div>
  <div class="b" style="left:20%;top:66%;width:110%;height:40%;background:#9FD3EE;filter:blur(${bl}px)"></div>
  <div class="b" style="left:-35%;top:78%;width:80%;height:40%;background:#CFE8C9;filter:blur(${bl}px)"></div>`;
}
const q = new URLSearchParams(location.search); const m = q.get('m'); const S = +(q.get('s')||1024);
const root = document.getElementById('root');
function iconMark(S, frac){ const w=Math.round(S*frac), h=Math.round(w*120/270);
  return `<div style="position:absolute;left:${Math.round((S-w)/2 - S*0.02)}px;top:${Math.round((S-h)/2 + S*0.02)}px">${liquid(w, LOOK)}</div>`; }
if (m==='icon') root.innerHTML = `<div class="s" style="width:${S}px;height:${S}px;background:#E6EFFA">${bloomBg(S)}${grain(S,S,0.4,'g')}${iconMark(S,0.74)}</div>`;
if (m==='abg') root.innerHTML = `<div class="s" style="width:${S}px;height:${S}px;background:#E6EFFA">${bloomBg(S)}${grain(S,S,0.4,'g')}</div>`;
if (m==='afg') root.innerHTML = `<div class="s" style="width:${S}px;height:${S}px">${iconMark(S,0.52)}</div>`;
if (m==='amono') { const w=Math.round(S*0.52),h=Math.round(w*120/270); root.innerHTML = `<div class="s" style="width:${S}px;height:${S}px"><div style="position:absolute;left:${Math.round((S-w)/2)}px;top:${Math.round((S-h)/2)}px">${hand(w,'#FFFFFF',10,0)}</div></div>`; }
if (m==='splash') { // 430x932 points, rendered at 3x
  const W=430,H=932, k=W/390;
  root.innerHTML = `<div class="s" style="width:${W}px;height:${H}px;background:#E6EFFA;font-family:Gaegu,cursive;color:#FBFCFF">
  <div class="b" style="left:${-160*k}px;top:${40+44}px;width:${700*k}px;height:300px;background:#F6DDE6;filter:blur(40px)"></div>
  <div class="b" style="left:${-140*k}px;top:${300+44}px;width:${680*k}px;height:240px;background:#6C7FD8;opacity:.9;filter:blur(42px)"></div>
  <div class="b" style="left:${120*k}px;top:${470+44}px;width:${420*k}px;height:160px;background:#9FD3EE;filter:blur(36px)"></div>
  <div class="b" style="left:${-180*k}px;top:${560+44}px;width:${420*k}px;height:180px;background:#EE8FA6;opacity:.5;filter:blur(40px)"></div>
  <div class="b" style="left:${140*k}px;top:${690+44}px;width:${460*k}px;height:260px;background:#CFE8C9;filter:blur(40px)"></div>
  ${grain(W,H,0.35,'g')}
  <div style="position:absolute;left:${Math.round((W-230)/2)}px;top:${340+44}px">${hand(230,'#FBFCFF',6,2.4)}</div>
  <div style="position:absolute;left:0;right:0;top:${470+44}px;text-align:center;font-size:26px">thank you for showing up</div>
  <div style="position:absolute;left:0;right:0;bottom:${48+40}px;text-align:center;font-size:18px;color:#6E5440">thanks for aio-ing today</div>
  </div>`; }
if (m==='fav') root.innerHTML = `<div class="s" style="width:${S}px;height:${S}px;border-radius:${S*0.225}px;background:#E6EFFA">${bloomBg(S)}${iconMark(S,0.8)}</div>`;
document.fonts.ready.then(()=>{document.title='ready'});
</script></body></html>
